name: packaging

# Holds what the release workflow will need, so a dispatched release does not find out first
# (docs/publishing.md). Called by ci.yml on a queued merge (and a pull request labelled
# `full-ci`); tools/release.py's tests and the changeset rule run in ci.yml's gates.
#   package        install the package and build a consumer against it,
#                  on every platform a release ships
#   scaffold       `ge new` writes a game repo and ge alone grows it (use, add
#                  system, lab, test), passes `ge check` against this tree, and
#                  plays it (sim, replay, play, state, diverge)
on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Build, install, consume
        run: |
          ROOT=$(cygpath -m "$PWD" 2>/dev/null || pwd)  # a path CMake reads on Windows too
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGE_PLATFORM=OFF -DGE_GPU=OFF
          # A bounded job count: an unbounded one under Make runs every source at once and the
          # runner runs out of memory.
          cmake --build build --config Release --parallel 4
          cmake --install build --config Release --prefix stage
          cmake -S tests/package/consumer -B build-consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$ROOT/stage"
          cmake --build build-consumer --config Release
          ctest --test-dir build-consumer -C Release --output-on-failure
          stage/bin/ge version

  scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: ge alone grows a new repo, then holds it to its whole gate, against this tree
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGE_PLATFORM=OFF -DGE_GPU=OFF
          cmake --build build --target ge
          G="$GITHUB_WORKSPACE/build/ge"
          "$G" new "$RUNNER_TEMP/snow-racer"
          cd "$RUNNER_TEMP/snow-racer"
          git init -q
          "$G" use skier
          "$G" add system wind
          "$G" add lab wind-sweep --kind=sim
          "$G" add lab wind-hold --kind=scenario
          "$G" add lab wind-look --kind=picture
          "$G" add lab wind-cost --kind=bench
          "$G" add test wind
          git add -A
          # CI's gates, as the new repo's own ci.yml runs them: ge check, the pilot, the replays.
          "$G" precheck --preset=debug --engine="$GITHUB_WORKSPACE"
          # A failed job's log, saved, read back as the finding it names.
          printf '2026-10-22T13:44:37.0Z ge check: error: src/a.cpp is not formatted\n' > "$RUNNER_TEMP/job.log"
          "$G" ci --log="$RUNNER_TEMP/job.log" --json > "$RUNNER_TEMP/ci.json" || true
          grep -q 'is not formatted' "$RUNNER_TEMP/ci.json"
          # Played: the pilot's runs, each replayed to its digest, the protocol scripted, a state
          # read, and a log changed at one line found where it parts.
          E=--engine="$GITHUB_WORKSPACE"
          "$G" sim --seeds=1,2 "$E"
          "$G" replay runs/snow_racer-1.inputs "$E"
          printf '{"op":"observe"}\n{"op":"act","input":{"steer":1},"steps":60}\n{"op":"end"}\n' | "$G" play --seed=1 "$E" | grep -q '"op":"end"'
          "$G" state runs/snow_racer-1.inputs --step=60 "$E"
          sed -e '/^digest/d' -e '/^steps/d' -e '9s/.*/1 1/' runs/snow_racer-1.inputs > runs/edited.inputs
          "$G" diverge runs/snow_racer-1.inputs runs/edited.inputs "$E" --json | grep -q '"same":false'

          # Measured: the step's cost tagged and compared, its zones, its allocations (release),
          # and its leaks under the debug build's LeakSanitizer.
          "$G" bench --seeds=1 --repeats=2 --tag=before "$E"
          "$G" bench --seeds=1 --repeats=2 --compare=before "$E"
          "$G" profile --seeds=1 --repeats=1 "$E"
          "$G" mem --seeds=1 --steps=600 "$E"
          "$G" leaks --seeds=1 "$E"

      - name: a racer from ge new plays a seed, replays it, shoots it, finds where two runs part, holds its bits
        run: |
          G="$GITHUB_WORKSPACE/build/ge"
          E=--engine="$GITHUB_WORKSPACE"
          "$G" new "$RUNNER_TEMP/kart-racer" --game=racer
          cd "$RUNNER_TEMP/kart-racer"
          git init -q
          "$G" add lab look --kind=picture
          "$G" add test laps
          git add -A
          "$G" check "$E"
          "$G" sim --seeds=38 "$E" --json | grep -q '"over":true'
          "$G" replay runs/kart_racer-38.inputs "$E"
          printf '{"op":"act","input":{"steer":0.5,"throttle":1},"steps":240}\n{"op":"end"}\n' | "$G" play --seed=38 "$E" | grep -q '"op":"end"'
          # A captioned still, headless: from the log at a step, and from the pilot's run.
          "$G" shot runs/kart_racer-38.inputs --step=1200 --view=car "$E"
          test -s runs/kart_racer-38-car-1200.png
          # The run recorded: PNG frames and the contact sheet (no encoder needed), then an MP4
          # where the runner has ffmpeg.
          "$G" record runs/kart_racer-38.inputs --view=car --to=4s --fps=10 --format=png --preset=debug "$E"
          test -s runs/kart_racer-38-car-sheet.png
          if command -v ffmpeg > /dev/null; then
            "$G" record runs/kart_racer-38.inputs --view=car --to=4s --fps=10 --size=320x240 --preset=debug "$E"
            test -s runs/kart_racer-38-car.mp4
          fi
          "$G" shot --seed=38 --view=track "$E" --json | grep -q '"view":"track"'
          # One input changed: diverge names the first step that differs.
          sed -e '/^digest/d' -e '/^steps/d' -e '9s/.*/1 1 0 0/' runs/kart_racer-38.inputs > runs/edited.inputs
          "$G" diverge runs/kart_racer-38.inputs runs/edited.inputs "$E" --json | grep -q '"same":false'
          # The recorded bits: every lab's digest committed and held by ge test, one lab checked
          # alone; a golden file's rows diffed column by column; a test with no golden written.
          "$G" digest --write "$E"
          test -s tests/labs_digests.txt
          "$G" digest look "$E" --json | grep -q '"state":"same"'
          "$G" test --filter=labs_smoke "$E"
          # A filter builds only its tests' targets: laps_test alone, then run.
          "$G" test --filter=laps "$E" --json | grep -q '"failed":0'
          mkdir -p tests/golden
          printf '# lap time-bits\n1 4059000000000000\n2 405a000000000000\n' > tests/golden/laps.txt
          "$G" golden diff --json | grep -q '"rows_changed":2'
          "$G" golden diff tests/golden/laps.txt --json | grep -q '"column":"time-bits"'
          "$G" golden write laps_test --preset=debug "$E" --json | grep -q 'does not write its golden'
